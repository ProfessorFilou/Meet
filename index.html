<!DOCTYPE html>
<html lang="de" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilouMeet - Videokonferenzen mit WebRTC</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f5f6f8', 100: '#ebedf2', 500: '#0f172a', 600: '#020617', 900: '#000000' }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes pulse-ring {
            0% { transform: scale(0.98); opacity: 0.9; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.02); opacity: 0; box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.98); opacity: 0; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .speaking-ring {
            animation: pulse-ring 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        .slash-line {
            transition: stroke-dashoffset 0.3s ease-in-out;
            stroke-dasharray: 40;
            stroke-dashoffset: 0;
        }
        .slash-hidden {
            stroke-dashoffset: 40;
        }
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.8); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
        }
        .floating-reaction {
            animation: floatUp 2.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-slate-900 selection:text-white dark:selection:bg-white dark:selection:text-slate-900">

    <header class="h-16 border-b border-slate-200 dark:border-slate-800 px-6 flex items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('home')">
            <div class="w-10 h-10 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center shadow-md font-bold text-lg">
                F
            </div>
            <span class="font-bold text-lg tracking-tight">FilouMeet</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="toggleDarkMode()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Dark/Light Mode">
                <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Container App -->
    <main id="app" class="flex-1 flex flex-col">
        <!-- Dynamischer Inhalt -->
    </main>

    <footer class="py-4 text-center text-xs text-slate-400 dark:text-slate-600 border-t border-slate-200 dark:border-slate-800">
        FilouMeet &bull; Echtzeit-Videokonferenzen mit WebRTC MediaStream & Live-Chat
    </footer>

    <script>
        const state = {
            view: 'home', // 'home', 'lobby', 'meeting', 'rejoin'
            userName: 'Maximilian',
            userColor: 'bg-indigo-600',
            meetingCode: '',
            isHost: false,
            micOn: true,
            camOn: true,
            isMutedAll: false,
            isLocked: false,
            handRaised: false,
            localStream: null,
            audioContext: null,
            analyser: null,
            isSpeaking: false,
            chatMessages: [
                { sender: 'System', text: 'Willkommen bei FilouMeet! Kamera und Mikrofon sind aktiv.', time: '14:00' }
            ],
            participants: [
                { id: '2', name: 'Sarah Becker', color: 'bg-emerald-600', mic: false, cam: true, speaking: false, hand: true, isHost: false },
                { id: '3', name: 'Julian Weber', color: 'bg-amber-600', mic: true, cam: false, speaking: false, hand: false, isHost: false }
            ]
        };

        const colors = [
            'bg-blue-600', 'bg-indigo-600', 'bg-violet-600', 'bg-purple-600', 
            'bg-pink-600', 'bg-rose-600', 'bg-red-600', 'bg-orange-600', 
            'bg-amber-600', 'bg-emerald-600', 'bg-teal-600', 'bg-cyan-600', 'bg-slate-800'
        ];

        // Hash Router für GitHub Pages
        const router = {
            navigate(viewName, params = {}) {
                state.view = viewName;
                if (params.code) state.meetingCode = params.code;
                if (params.isHost !== undefined) state.isHost = params.isHost;
                window.location.hash = viewName + (state.meetingCode ? '/' + state.meetingCode : '');
                render();
                if (viewName === 'meeting') {
                    initWebRTCStream();
                }
            },
            init() {
                const hash = window.location.hash.replace('#', '');
                if (hash.startsWith('meeting')) {
                    const parts = hash.split('/');
                    state.meetingCode = parts[1] || 'filou-room-101';
                    state.view = 'meeting';
                    initWebRTCStream();
                } else if (hash.startsWith('lobby')) {
                    state.view = 'lobby';
                } else {
                    state.view = 'home';
                }
                render();
            }
        };

        window.addEventListener('hashchange', () => router.init());

        async function initWebRTCStream() {
            try {
                if (!state.localStream) {
                    state.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                }
                attachLocalStreamToVideo();
                setupAudioAnalyser(state.localStream);
            } catch (err) {
                console.warn('WebRTC MediaStream Zugriff verweigert oder nicht verfügbar:', err);
            }
        }

        function attachLocalStreamToVideo() {
            const videoEl = document.getElementById('local-video-element');
            if (videoEl && state.localStream) {
                videoEl.srcObject = state.localStream;
                videoEl.muted = true;
            }
        }

        function setupAudioAnalyser(stream) {
            try {
                if (!state.audioContext) {
                    state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const source = state.audioContext.createMediaStreamSource(stream);
                    state.analyser = state.audioContext.createAnalyser();
                    state.analyser.fftSize = 512;
                    source.connect(state.analyser);
                    
                    const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
                    const checkAudioLevel = () => {
                        if (state.view === 'meeting' && state.analyser && state.micOn) {
                            state.analyser.getByteFrequencyData(dataArray);
                            let sum = 0;
                            for (let i = 0; i < dataArray.length; i++) {
                                sum += dataArray[i];
                            }
                            let avg = sum / dataArray.length;
                            state.isSpeaking = avg > 12; // Schwellenwert für Sprachaktivität
                            
                            // UI Indikator aktualisieren
                            const ringEl = document.getElementById('local-speaking-ring');
                            if (ringEl) {
                                if (state.isSpeaking) {
                                    ringEl.classList.remove('hidden');
                                } else {
                                    ringEl.classList.add('hidden');
                                }
                            }
                        }
                        requestAnimationFrame(checkAudioLevel);
                    };
                    checkAudioLevel();
                }
            } catch (e) {
                console.log('Audio Analyser konnte nicht gestartet werden:', e);
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
            }
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (state.view === 'home') {
                app.innerHTML = renderHome();
            } else if (state.view === 'lobby') {
                app.innerHTML = renderLobby();
            } else if (state.view === 'meeting') {
                app.innerHTML = renderMeeting();
                setTimeout(attachLocalStreamToVideo, 50);
            } else if (state.view === 'rejoin') {
                app.innerHTML = renderRejoin();
            }
        }

        function renderHome() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center px-4 max-w-4xl mx-auto text-center py-12">
                    <div class="w-20 h-20 rounded-3xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center text-3xl font-extrabold shadow-2xl mb-6">
                        F
                    </div>
                    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-4">Echte Videokonferenzen im Browser.</h1>
                    <p class="text-lg text-slate-600 dark:text-slate-400 max-w-xl mb-10">
                        Mit echten WebRTC Kamera- & Mikrofoneingaben, sprechenden Sprach-Ripples, Chat und voller Host-Kontrolle.
                    </p>
                    <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md">
                        <button onclick="startNewMeeting()" class="flex-1 bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 font-semibold py-4 px-6 rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center space-x-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                            <span>Meeting erstellen</span>
                        </button>
                        <button onclick="goToLobby()" class="flex-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold py-4 px-6 rounded-2xl transition transform active:scale-95 flex items-center justify-center space-x-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
                            <span>Beitreten</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function startNewMeeting() {
            state.isHost = true;
            state.meetingCode = 'filou-' + Math.random().toString(36).substring(2, 7);
            router.navigate('lobby');
        }

        function goToLobby() {
            state.isHost = false;
            router.navigate('lobby');
        }

        function renderLobby() {
            const firstLetter = (state.userName.trim().charAt(0) || 'M').toUpperCase();
            const colorOptionsHtml = colors.map(c => `
                <button onclick="selectColor('${c}')" class="w-10 h-10 rounded-full ${c} transition transform hover:scale-110 ${state.userColor === c ? 'ring-4 ring-offset-2 ring-slate-900 dark:ring-white' : ''}"></button>
            `).join('');

            return `
                <div class="flex-1 flex items-center justify-center px-4 py-12">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl">
                        <h2 class="text-2xl font-bold mb-6 text-center">Meeting Vorbereitung</h2>
                        
                        <div class="flex flex-col items-center mb-6">
                            <div class="w-24 h-24 rounded-full ${state.userColor} text-white flex items-center justify-center text-4xl font-extrabold shadow-lg mb-3 transition-all duration-300">
                                ${firstLetter}
                            </div>
                            <span class="text-xs text-slate-500">Kreis-Avatar (Initial aus Name)</span>
                        </div>

                        <div class="mb-4">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Dein Name</label>
                            <input type="text" id="input-name" value="${state.userName}" oninput="updateName(this.value)" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white font-medium">
                        </div>

                        <div class="mb-6">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Avatar Farbe</label>
                            <div class="flex flex-wrap gap-2 justify-center">
                                ${colorOptionsHtml}
                            </div>
                        </div>

                        ${!state.isHost ? `
                        <div class="mb-6">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Meeting Code</label>
                            <input type="text" id="input-code" value="${state.meetingCode}" oninput="state.meetingCode=this.value" placeholder="z.B. filou-abc12" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white font-medium">
                        </div>
                        ` : `
                        <div class="mb-6 p-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-center">
                            <span class="text-xs text-slate-500 block">Meeting-Code:</span>
                            <span class="font-mono font-bold text-lg">${state.meetingCode}</span>
                        </div>
                        `}

                        <div class="flex gap-3">
                            <button onclick="router.navigate('home')" class="w-1/3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold py-3.5 rounded-xl transition">Zurück</button>
                            <button onclick="joinMeeting()" class="w-2/3 bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 font-semibold py-3.5 rounded-xl shadow-lg transition">Beitreten</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateName(val) {
            state.userName = val || 'Gast';
            const initial = (state.userName.trim().charAt(0) || 'G').toUpperCase();
            const preview = document.querySelector('.w-24.h-24');
            if (preview) preview.innerText = initial;
        }

        function selectColor(color) {
            state.userColor = color;
            render();
        }

        function joinMeeting() {
            router.navigate('meeting', { code: state.meetingCode || 'filou-room-101' });
        }

        function renderMeeting() {
            const myInitial = (state.userName.trim().charAt(0) || 'G').toUpperCase();
            
            let tilesHtml = `
                <!-- Eigene Kachel mit echtem Video-Feed -->
                <div class="relative bg-slate-900 dark:bg-slate-900 rounded-3xl overflow-hidden shadow-xl border border-slate-800 flex flex-col items-center justify-center cursor-pointer group transition transform hover:scale-[1.01]">
                    <div id="local-speaking-ring" class="absolute inset-0 rounded-3xl speaking-ring pointer-events-none hidden"></div>
                    
                    <video id="local-video-element" autoplay playsinline class="absolute inset-0 w-full h-full object-cover ${state.camOn ? '' : 'hidden'}"></video>
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent flex items-center justify-center ${state.camOn ? 'hidden' : ''}">
                        <div class="w-28 h-28 rounded-full ${state.userColor} text-white flex items-center justify-center text-5xl font-extrabold shadow-2xl">
                            ${myInitial}
                        </div>
                    </div>

                    <div class="absolute bottom-4 left-4 bg-slate-950/70 backdrop-blur-md px-3 py-1.5 rounded-xl text-white text-xs font-medium flex items-center space-x-2 z-10">
                        <span>${state.userName} (Du)</span>
                        ${state.handRaised ? '<span class="text-amber-400">✋</span>' : ''}
                        ${!state.micOn ? '<svg class="w-3.5 h-3.5 text-red-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2.5"/></svg>' : ''}
                    </div>
                </div>
            `;

            state.participants.forEach(p => {
                tilesHtml += `
                    <div class="relative bg-slate-900 dark:bg-slate-900 rounded-3xl overflow-hidden shadow-xl border border-slate-800 flex flex-col items-center justify-center cursor-pointer group transition transform hover:scale-[1.01]">
                        ${p.mic && p.speaking ? '<div class="absolute inset-0 rounded-3xl speaking-ring pointer-events-none"></div>' : ''}
                        
                        <div class="w-28 h-28 rounded-full ${p.color} text-white flex items-center justify-center text-5xl font-extrabold shadow-2xl">
                            ${p.name.charAt(0).toUpperCase()}
                        </div>

                        <div class="absolute bottom-4 left-4 bg-slate-950/70 backdrop-blur-md px-3 py-1.5 rounded-xl text-white text-xs font-medium flex items-center space-x-2 z-10">
                            <span>${p.name}</span>
                            ${p.hand ? '<span class="text-amber-400">✋</span>' : ''}
                            ${!p.mic ? '<svg class="w-3.5 h-3.5 text-red-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2.5"/></svg>' : ''}
                        </div>
                    </div>
                `;
            });

            const chatHtml = state.chatMessages.map(m => `
                <div class="mb-3">
                    <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">
                        <span class="font-semibold text-slate-700 dark:text-slate-300">${m.sender}</span>
                        <span>${m.time}</span>
                    </div>
                    <div class="bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl text-sm">${m.text}</div>
                </div>
            `).join('');

            return `
                <div class="flex-1 flex flex-col h-[calc(100vh-4rem)] relative overflow-hidden bg-slate-950">
                    
                    <div id="reactions-container" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>

                    <div class="flex-1 flex overflow-hidden p-4 gap-4">
                        
                        <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto">
                            ${tilesHtml}
                        </div>

                        <!-- Sidebar / Chat -->
                        <div class="w-80 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl flex flex-col shadow-2xl overflow-hidden">
                            
                            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                <span class="font-bold text-sm">Meeting Chat & Aktionen</span>
                                ${state.isHost ? '<span class="bg-amber-500/10 text-amber-500 text-[10px] font-bold px-2 py-0.5 rounded-full">Host</span>' : ''}
                            </div>

                            ${state.isHost ? `
                                <div class="p-3 bg-slate-50 dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 grid grid-cols-2 gap-2">
                                    <button onclick="toggleMuteAll()" class="text-xs font-semibold py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                                        ${state.isMutedAll ? 'Alle Entmuten' : 'Alle Stummschalten'}
                                    </button>
                                    <button onclick="toggleLockRoom()" class="text-xs font-semibold py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                                        ${state.isLocked ? 'Raum entsperren' : 'Raum sperren'}
                                    </button>
                                </div>
                            ` : ''}

                            <div id="chat-scroll" class="flex-1 p-4 overflow-y-auto">
                                ${chatHtml}
                            </div>

                            <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex items-center space-x-2">
                                <input type="text" id="chat-input" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Nachricht schreiben..." class="flex-1 bg-slate-100 dark:bg-slate-800 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:ring-1 focus:ring-slate-900 dark:focus:ring-white">
                                <button onclick="sendChatMessage()" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 p-2.5 rounded-xl font-bold hover:opacity-90 transition">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Unten: Steuerungsleiste -->
                    <div class="h-20 bg-slate-900/90 backdrop-blur-xl border-t border-slate-800 px-6 flex items-center justify-between z-40">
                        
                        <div class="flex items-center space-x-3 text-white text-sm font-medium">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>Code: <strong class="font-mono">${state.meetingCode}</strong></span>
                        </div>

                        <div class="flex items-center space-x-3">
                            <!-- Mic Button -->
                            <button onclick="toggleMic()" class="w-12 h-12 rounded-full ${state.micOn ? 'bg-slate-800 hover:bg-slate-700 text-white' : 'bg-red-600 text-white'} flex items-center justify-center shadow-lg transition transform active:scale-90 relative" title="Mikrofon">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                                    <line x1="3" y1="3" x2="21" y2="21" class="slash-line ${state.micOn ? 'slash-hidden' : ''}" stroke="currentColor" stroke-width="2.5"/>
                                </svg>
                            </button>

                            <!-- Cam Button -->
                            <button onclick="toggleCam()" class="w-12 h-12 rounded-full ${state.camOn ? 'bg-slate-800 hover:bg-slate-700 text-white' : 'bg-red-600 text-white'} flex items-center justify-center shadow-lg transition transform active:scale-90 relative" title="Kamera">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                    <line x1="3" y1="3" x2="21" y2="21" class="slash-line ${state.camOn ? 'slash-hidden' : ''}" stroke="currentColor" stroke-width="2.5"/>
                                </svg>
                            </button>

                            <!-- Hand heben -->
                            <button onclick="toggleHand()" class="w-12 h-12 rounded-full ${state.handRaised ? 'bg-amber-500 text-white' : 'bg-slate-800 hover:bg-slate-700 text-white'} flex items-center justify-center shadow-lg transition transform active:scale-90 text-lg" title="Hand heben">
                                ✋
                            </button>

                            <!-- Reaktionen Emojis -->
                            <button onclick="sendReaction('👍')" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg transition transform active:scale-90 text-lg" title="Daumen hoch">👍</button>
                            <button onclick="sendReaction('❤️')" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg transition transform active:scale-90 text-lg" title="Herz">❤️</button>
                            <button onclick="sendReaction('🔥')" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg transition transform active:scale-90 text-lg" title="Fire">🔥</button>
                        </div>

                        <div>
                            <button onclick="leaveMeeting()" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2.5 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center space-x-2">
                                <span>Verlassen</span>
                            </button>
                        </div>

                    </div>
                </div>
            `;
        }

        function toggleMic() {
            state.micOn = !state.micOn;
            if (state.localStream) {
                state.localStream.getAudioTracks().forEach(track => track.enabled = state.micOn);
            }
            render();
        }

        function toggleCam() {
            state.camOn = !state.camOn;
            if (state.localStream) {
                state.localStream.getVideoTracks().forEach(track => track.enabled = state.camOn);
            }
            render();
        }

        function toggleHand() {
            state.handRaised = !state.handRaised;
            render();
        }

        function toggleMuteAll() {
            state.isMutedAll = !state.isMutedAll;
            state.participants.forEach(p => p.mic = !state.isMutedAll);
            render();
        }

        function toggleLockRoom() {
            state.isLocked = !state.isLocked;
            state.chatMessages.push({ sender: 'System', text: state.isLocked ? 'Raum wurde gesperrt.' : 'Raum wurde entsperrt.', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            render();
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            if (!input || !input.value.trim()) return;
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            state.chatMessages.push({ sender: state.userName, text: input.value.trim(), time: timeStr });
            input.value = '';
            render();
            const scroll = document.getElementById('chat-scroll');
            if (scroll) scroll.scrollTop = scroll.scrollHeight;
        }

        function sendReaction(emoji) {
            const container = document.getElementById('reactions-container');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'absolute bottom-12 left-1/2 text-4xl floating-reaction pointer-events-none';
            el.style.marginLeft = (Math.random() * 240 - 120) + 'px';
            el.innerText = emoji;
            container.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function leaveMeeting() {
            if (state.localStream) {
                state.localStream.getTracks().forEach(track => track.stop());
                state.localStream = null;
            }
            router.navigate('rejoin');
        }

        function renderRejoin() {
            return `
                <div class="flex-1 flex items-center justify-center px-4 py-12">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
                        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                            ✓
                        </div>
                        <h2 class="text-2xl font-bold mb-2">Meeting verlassen</h2>
                        <p class="text-slate-600 dark:text-slate-400 text-sm mb-8">Du kannst jederzeit wieder beitreten oder zur Startseite zurückkehren.</p>
                        
                        <div class="flex flex-col gap-3">
                            <button onclick="joinMeeting()" class="w-full bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 font-semibold py-3.5 rounded-xl shadow-lg transition">
                                Wieder beitreten
                            </button>
                            <button onclick="router.navigate('home')" class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-semibold py-3.5 rounded-xl transition">
                                Zur Startseite
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>
