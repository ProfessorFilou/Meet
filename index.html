<!DOCTYPE html>
<html lang="de" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FilouMeet - Sichere Videokonferenzen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom animations & transitions */
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .speaking-glow {
            animation: pulse-ring 1.5s infinite ease-in-out;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.7);
        }
        @keyframes float-up {
            0% { transform: translateY(0px) scale(0.5); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
        }
        .floating-reaction {
            animation: float-up 2.2s ease-out forwards;
        }
        /* Hide scrollbars for slick mobile drawers */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('lobby')">
            <div class="w-10 h-10 rounded-xl bg-slate-900 dark:bg-brand-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
                F
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-tight">FilouMeet</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Secure Video Rooms</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-4">
            <!-- Dark Mode Toggle -->
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300" title="Design wechseln">
                <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            <div id="nav-meeting-info" class="hidden items-center space-x-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-full text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="nav-room-code-display" class="font-mono font-semibold"></span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col relative overflow-hidden">

        <!-- VIEW 1: LOBBY & PRE-JOIN SETUP -->
        <div id="view-lobby" class="flex-1 flex items-center justify-center p-4 sm:p-6">
            <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold tracking-tight">Meeting beitreten</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Konfiguriere Kamera & Audio vor dem Start</p>
                </div>

                <!-- Preview Camera Container -->
                <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden mb-6 shadow-inner flex items-center justify-center">
                    <video id="preview-video" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
                    <div id="preview-avatar-fallback" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 text-white hidden">
                        <div id="preview-avatar-circle" class="w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold uppercase mb-2 shadow-lg bg-brand-600">F</div>
                        <span class="text-xs text-slate-400">Kamera deaktiviert</span>
                    </div>
                    <!-- Audio Level Meter inside Lobby -->
                    <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full flex items-center space-x-2 text-white text-xs">
                        <span id="preview-mic-status-icon" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span id="preview-mic-label">Mikrofon aktiv</span>
                    </div>
                </div>

                <!-- Setup Controls (Cam/Mic toggles) -->
                <div class="flex items-center justify-center space-x-4 mb-6">
                    <button onclick="togglePreviewCam()" id="preview-btn-cam" class="p-3.5 rounded-full bg-slate-900 text-white dark:bg-slate-800 hover:scale-105 transition shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                    <button onclick="togglePreviewMic()" id="preview-btn-mic" class="p-3.5 rounded-full bg-slate-900 text-white dark:bg-slate-800 hover:scale-105 transition shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    </button>
                </div>

                <!-- Input form -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1.5">Dein Name</label>
                        <input type="text" id="input-username" value="Professor Filou" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-medium" placeholder="Name eingeben...">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1.5">Meeting Code / ID</label>
                        <div class="flex space-x-2">
                            <input type="text" id="input-room-code" value="filou-room-1" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-brand-500 font-mono text-sm font-semibold" placeholder="z.B. masterclass">
                            <button onclick="generateRandomRoom()" class="px-4 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold rounded-xl transition">Neu</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1.5">Avatar Farbe</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" id="input-color" value="#22c55e" class="w-10 h-10 rounded-xl border-0 cursor-pointer bg-transparent">
                            <span class="text-xs text-slate-500">Wähle deine Profilfarbe für Initialen-Avatare</span>
                        </div>
                    </div>

                    <button onclick="joinMeeting()" class="w-full mt-2 py-3.5 bg-slate-900 dark:bg-brand-600 text-white rounded-xl font-bold text-sm shadow-lg hover:opacity-95 transition flex items-center justify-center space-x-2">
                        <span>Meeting betreten</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW 2: ACTIVE MEETING ROOM -->
        <div id="view-meeting" class="hidden flex-1 flex flex-col lg:flex-row relative overflow-hidden h-full">
            
            <!-- Main Video Grid Area -->
            <div class="flex-1 flex flex-col p-3 sm:p-4 lg:p-6 overflow-y-auto relative pb-24 lg:pb-20">
                
                <!-- Room Status Bar -->
                <div class="flex items-center justify-between mb-4 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-slate-200/60 dark:border-slate-800/60 shadow-sm">
                    <div class="flex items-center space-x-3">
                        <span class="font-bold text-sm" id="room-title-display">Meeting</span>
                        <span class="text-xs text-slate-400">|</span>
                        <span class="text-xs text-slate-500 dark:text-slate-400 flex items-center space-x-1">
                            <svg class="w-3.5 h-3.5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            <span id="participant-count">1</span> Teilnehmer
                        </span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="copyInviteLink()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold rounded-xl transition flex items-center space-x-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                            <span>Link kopieren</span>
                        </button>
                    </div>
                </div>

                <!-- Video Grid - Optimized for Mobile & Desktop -->
                <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4 flex-1 auto-rows-fr">
                    <!-- Dynamic Video Tiles injected via JS -->
                </div>

                <!-- Floating Reactions Layer -->
                <div id="reactions-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
            </div>

            <!-- Sidebar / Chat / Participants Drawer (Desktop sidebar or Mobile slide-over) -->
            <div id="sidebar-panel" class="fixed inset-y-0 right-0 z-40 w-full sm:w-80 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 flex flex-col transform translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 shadow-2xl lg:shadow-none">
                <!-- Sidebar Header -->
                <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <div class="flex space-x-2">
                        <button onclick="switchTab('chat')" id="tab-btn-chat" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white dark:bg-brand-600 transition">Chat</button>
                        <button onclick="switchTab('participants')" id="tab-btn-participants" class="px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Teilnehmer (<span id="sidebar-count">1</span>)</button>
                    </div>
                    <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- Tab Content: Chat -->
                <div id="tab-content-chat" class="flex-1 flex flex-col overflow-hidden">
                    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                        <div class="text-center my-2">
                            <span class="text-[11px] bg-slate-100 dark:bg-slate-800 text-slate-500 px-3 py-1 rounded-full">Meeting gestartet. Willkommen bei FilouMeet!</span>
                        </div>
                    </div>
                    <div class="p-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900">
                        <form onsubmit="sendChatMessage(event)" class="flex space-x-2">
                            <input type="text" id="chat-input" placeholder="Nachricht schreiben..." class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <button type="submit" class="px-4 py-2.5 bg-slate-900 dark:bg-brand-600 text-white rounded-xl text-xs font-bold hover:opacity-90 transition">Senden</button>
                        </form>
                    </div>
                </div>

                <!-- Tab Content: Participants List -->
                <div id="tab-content-participants" class="hidden flex-1 flex flex-col overflow-y-auto p-4 space-y-3">
                    <div id="participants-list" class="space-y-2">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>

            <!-- Bottom Control Bar (Fixed mobile-friendly floating pill) -->
            <div class="absolute bottom-4 left-0 right-0 z-30 flex items-center justify-center px-4 pointer-events-none">
                <div class="pointer-events-auto bg-slate-900/90 dark:bg-slate-900/95 backdrop-blur-md border border-slate-700/50 p-2.5 rounded-2xl shadow-2xl flex items-center space-x-2 sm:space-x-3">
                    
                    <!-- Mic Toggle -->
                    <button onclick="toggleMeetingMic()" id="ctrl-mic" class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition relative group" title="Mikrofon ein/aus">
                        <svg id="icon-mic-on" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        <svg id="icon-mic-off" class="w-5 h-5 text-rose-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l2 2m0-2l-2 2"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 10a6 6 0 01-9.338 4.981L17 10.02v-.02z"></path></svg>
                    </button>

                    <!-- Camera Toggle -->
                    <button onclick="toggleMeetingCam()" id="ctrl-cam" class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition relative" title="Kamera ein/aus">
                        <svg id="icon-cam-on" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <svg id="icon-cam-off" class="w-5 h-5 text-rose-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-12.728 12.728M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>

                    <div class="h-6 w-px bg-slate-700 mx-1"></div>

                    <!-- Hand Raise Button -->
                    <button onclick="toggleHandRaise()" id="ctrl-hand" class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition" title="Hand heben">
                        <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                    </button>

                    <!-- Reactions Popover / Quick Trigger -->
                    <div class="relative group">
                        <button class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition text-lg" title="Reaktionen">👍</button>
                        <div class="absolute bottom-full mb-3 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 p-2 rounded-2xl shadow-xl hidden group-hover:flex space-x-2">
                            <button onclick="sendReaction('👍')" class="p-2 hover:bg-slate-700 rounded-xl text-lg">👍</button>
                            <button onclick="sendReaction('❤️')" class="p-2 hover:bg-slate-700 rounded-xl text-lg">❤️</button>
                            <button onclick="sendReaction('👏')" class="p-2 hover:bg-slate-700 rounded-xl text-lg">👏</button>
                            <button onclick="sendReaction('🔥')" class="p-2 hover:bg-slate-700 rounded-xl text-lg">🔥</button>
                            <button onclick="sendReaction('😂')" class="p-2 hover:bg-slate-700 rounded-xl text-lg">😂</button>
                        </div>
                    </div>

                    <!-- Chat / Drawer Toggle (Mobile) -->
                    <button onclick="toggleSidebar()" class="lg:hidden p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition relative" title="Chat öffnen">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </button>

                    <div class="h-6 w-px bg-slate-700 mx-1"></div>

                    <!-- Leave Room Button -->
                    <button onclick="leaveMeeting()" class="px-4 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-lg transition flex items-center space-x-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        <span class="hidden sm:inline">Verlassen</span>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        const state = {
            currentView: 'lobby',
            username: 'Professor Filou',
            roomCode: 'filou-room-1',
            color: '#22c55e',
            isCamOn: true,
            isMicOn: true,
            isHandRaised: false,
            localStream: null,
            audioContext: null,
            analyser: null,
            microphone: null,
            audioLevelInterval: null,
            participants: [],
            chatMessages: []
        };

        // --- Router Implementation for Hash Navigation ---
        const router = {
            init() {
                window.addEventListener('hashchange', () => this.handleRoute());
                this.handleRoute();
            },
            handleRoute() {
                const hash = window.location.hash.replace('#', '');
                if (hash.startsWith('meeting=')) {
                    const room = hash.split('=')[1];
                    if (room) {
                        document.getElementById('input-room-code').value = room;
                        if (state.currentView !== 'meeting') {
                            // Auto join if arriving via direct share link
                            joinMeeting(true);
                        }
                    }
                } else {
                    if (state.currentView === 'meeting') {
                        leaveMeeting(false);
                    }
                    this.showView('lobby');
                }
            },
            showView(viewName) {
                state.currentView = viewName;
                const lobby = document.getElementById('view-lobby');
                const meeting = document.getElementById('view-meeting');
                const navInfo = document.getElementById('nav-meeting-info');

                if (viewName === 'lobby') {
                    lobby.classList.remove('hidden');
                    meeting.classList.add('hidden');
                    navInfo.classList.add('hidden');
                    startPreviewStream();
                } else {
                    lobby.classList.add('hidden');
                    meeting.classList.remove('hidden');
                    navInfo.classList.remove('hidden');
                    document.getElementById('nav-room-code-display').textContent = state.roomCode;
                    document.getElementById('room-title-display').textContent = `Raum: ${state.roomCode}`;
                }
            },
            navigate(route, param = '') {
                if (route === 'lobby') {
                    window.location.hash = '';
                } else if (route === 'meeting') {
                    window.location.hash = `meeting=${param}`;
                }
            }
        };

        // --- Dark Mode ---
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        // --- Media Stream & Preview ---
        async function startPreviewStream() {
            try {
                if (!state.localStream) {
                    state.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                }
                const previewVideo = document.getElementById('preview-video');
                previewVideo.srcObject = state.localStream;
                previewVideo.style.display = 'block';
                document.getElementById('preview-avatar-fallback').classList.add('hidden');
                initAudioAnalyzer(state.localStream);
            } catch (err) {
                console.warn('Kamera/Mikrofon nicht verfügbar:', err);
                document.getElementById('preview-video').style.display = 'none';
                document.getElementById('preview-avatar-fallback').classList.remove('hidden');
                // Set initial letter
                const name = document.getElementById('input-username').value || 'User';
                const circle = document.getElementById('preview-avatar-circle');
                circle.textContent = name.charAt(0).toUpperCase();
                circle.style.backgroundColor = document.getElementById('input-color').value;
            }
        }

        function togglePreviewCam() {
            state.isCamOn = !state.isCamOn;
            if (state.localStream) {
                const videoTracks = state.localStream.getVideoTracks();
                videoTracks.forEach(track => track.enabled = state.isCamOn);
            }
            const btn = document.getElementById('preview-btn-cam');
            btn.classList.toggle('bg-rose-600', !state.isCamOn);
            btn.classList.toggle('bg-slate-900', state.isCamOn);
        }

        function togglePreviewMic() {
            state.isMicOn = !state.isMicOn;
            if (state.localStream) {
                const audioTracks = state.localStream.getAudioTracks();
                audioTracks.forEach(track => track.enabled = state.isMicOn);
            }
            const btn = document.getElementById('preview-btn-mic');
            btn.classList.toggle('bg-rose-600', !state.isMicOn);
            btn.classList.toggle('bg-slate-900', state.isMicOn);
            const statusIcon = document.getElementById('preview-mic-status-icon');
            statusIcon.classList.toggle('bg-rose-500', !state.isMicOn);
            statusIcon.classList.toggle('bg-emerald-400', state.isMicOn);
            document.getElementById('preview-mic-label').textContent = state.isMicOn ? 'Mikrofon aktiv' : 'Stummgeschaltet';
        }

        // --- Web Audio API Speaking Detection ---
        function initAudioAnalyzer(stream) {
            try {
                if (!window.AudioContext && !window.webkitAudioContext) return;
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                state.analyser = state.audioContext.createAnalyser();
                state.microphone = state.audioContext.createMediaStreamSource(stream);
                state.microphone.connect(state.analyser);
                state.analyser.fftSize = 256;
                const bufferLength = state.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                if (state.audioLevelInterval) clearInterval(state.audioLevelInterval);
                state.audioLevelInterval = setInterval(() => {
                    if (!state.analyser || !state.isMicOn) return;
                    state.analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / bufferLength;
                    const localTile = document.getElementById('tile-local');
                    if (localTile) {
                        if (average > 25) {
                            localTile.classList.add('speaking-glow', 'border-brand-500');
                        } else {
                            localTile.classList.remove('speaking-glow', 'border-brand-500');
                        }
                    }
                }, 200);
            } catch (e) {
                console.log('Audio analyzer error:', e);
            }
        }

        function generateRandomRoom() {
            const code = 'filou-' + Math.random().toString(36.substring(2, 8));
            document.getElementById('input-room-code').value = code;
        }

        // --- Join & Leave Meeting ---
        async function joinMeeting(fromRoute = false) {
            state.username = document.getElementById('input-username').value.trim() || 'Gast';
            state.roomCode = document.getElementById('input-room-code').value.trim() || 'meeting-1';
            state.color = document.getElementById('input-color').value || '#22c55e';

            if (!fromRoute) {
                router.navigate('meeting', state.roomCode);
            }

            router.showView('meeting');

            // Initialize local participant (ZERO FAKE PEOPLE - only real user)
            state.participants = [{
                id: 'local-user',
                name: state.username,
                color: state.color,
                isCamOn: state.isCamOn,
                isMicOn: state.isMicOn,
                isHandRaised: false,
                isLocal: true
            }];

            renderMeetingUI();
        }

        function leaveMeeting(updateRouter = true) {
            if (state.localStream) {
                state.localStream.getTracks().forEach(track => track.stop());
                state.localStream = null;
            }
            if (state.audioLevelInterval) clearInterval(state.audioLevelInterval);
            if (state.audioContext) state.audioContext.close();

            if (updateRouter) {
                router.navigate('lobby');
            }
        }

        // --- Active Meeting Controls ---
        function toggleMeetingMic() {
            state.isMicOn = !state.isMicOn;
            if (state.localStream) {
                state.localStream.getAudioTracks().forEach(track => track.enabled = state.isMicOn);
            }
            const p = state.participants.find(x => x.isLocal);
            if (p) p.isMicOn = state.isMicOn;

            // Update UI buttons
            document.getElementById('icon-mic-on').classList.toggle('hidden', !state.isMicOn);
            document.getElementById('icon-mic-off').classList.toggle('hidden', state.isMicOn);
            renderMeetingUI();
        }

        function toggleMeetingCam() {
            state.isCamOn = !state.isCamOn;
            if (state.localStream) {
                state.localStream.getVideoTracks().forEach(track => track.enabled = state.isCamOn);
            }
            const p = state.participants.find(x => x.isLocal);
            if (p) p.isCamOn = state.isCamOn;

            document.getElementById('icon-cam-on').classList.toggle('hidden', !state.isCamOn);
            document.getElementById('icon-cam-off').classList.toggle('hidden', state.isCamOn);
            renderMeetingUI();
        }

        function toggleHandRaise() {
            state.isHandRaised = !state.isHandRaised;
            const p = state.participants.find(x => x.isLocal);
            if (p) p.isHandRaised = state.isHandRaised;
            const btn = document.getElementById('ctrl-hand');
            btn.classList.toggle('bg-amber-600', state.isHandRaised);
            btn.classList.toggle('bg-slate-800', !state.isHandRaised);
            renderMeetingUI();
        }

        function sendReaction(emoji) {
            const container = document.getElementById('reactions-container');
            const el = document.createElement('div');
            el.className = 'absolute bottom-12 left-1/2 transform -translate-x-1/2 text-4xl floating-reaction pointer-events-none';
            el.style.left = `${Math.random() * 80 + 10}%`;
            el.textContent = emoji;
            container.appendChild(el);
            setTimeout(() => el.remove(), 2200);
        }

        function copyInviteLink() {
            const url = window.location.href;
            document.execCommand('copy');
            // Fallback modern copy
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url);
            }
            showNotification('Meeting-Link in Zwischenablage kopiert!');
        }

        function showNotification(msg) {
            const div = document.createElement('div');
            div.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2 rounded-2xl shadow-xl text-xs font-bold z-50 transition animate-bounce';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        // --- Sidebar & Mobile Drawer Toggle ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-panel');
            sidebar.classList.toggle('translate-x-full');
        }

        function switchTab(tab) {
            const chatBtn = document.getElementById('tab-btn-chat');
            const partBtn = document.getElementById('tab-btn-participants');
            const chatContent = document.getElementById('tab-content-chat');
            const partContent = document.getElementById('tab-content-participants');

            if (tab === 'chat') {
                chatBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white dark:bg-brand-600 transition';
                partBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition';
                chatContent.classList.remove('hidden');
                partContent.classList.add('hidden');
            } else {
                partBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white dark:bg-brand-600 transition';
                chatBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition';
                partContent.classList.remove('hidden');
                chatContent.classList.add('hidden');
            }
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            state.chatMessages.push({ sender: state.username, text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            input.value = '';
            renderChatMessages();
        }

        function renderChatMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = state.chatMessages.map(m => `
                <div class="flex flex-col">
                    <div class="flex items-center space-x-1.5 mb-0.5">
                        <span class="font-bold text-[11px] text-slate-700 dark:text-slate-300">${m.sender}</span>
                        <span class="text-[9px] text-slate-400">${m.time}</span>
                    </div>
                    <div class="bg-slate-100 dark:bg-slate-800/80 p-2.5 rounded-2xl text-xs text-slate-800 dark:text-slate-200">
                        ${m.text}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        // --- Render UI (Grid & Participants) ---
        function renderMeetingUI() {
            const grid = document.getElementById('video-grid');
            document.getElementById('participant-count').textContent = state.participants.length;
            document.getElementById('sidebar-count').textContent = state.participants.length;

            // Render Video Grid Tiles
            grid.innerHTML = state.participants.map(p => {
                const initial = p.name.charAt(0).toUpperCase();
                return `
                    <div id="${p.isLocal ? 'tile-local' : 'tile-' + p.id}" class="relative bg-slate-900 rounded-3xl overflow-hidden aspect-video sm:aspect-auto sm:h-full flex items-center justify-center border-2 border-transparent shadow-lg transition-all">
                        ${p.isLocal && state.localStream && p.isCamOn ? `
                            <video autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100" id="local-video-element"></video>
                        ` : `
                            <div class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900">
                                <div class="w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold uppercase text-white shadow-xl mb-2" style="background-color: ${p.color};">
                                    ${initial}
                                </div>
                                <span class="text-xs text-slate-400 font-medium">${p.name} (Kamera aus)</span>
                            </div>
                        `}

                        <!-- Participant Label & Hand Raise Badge -->
                        <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl flex items-center space-x-2 text-white text-xs z-10">
                            <span class="w-2 h-2 rounded-full ${p.isMicOn ? 'bg-emerald-400' : 'bg-rose-500'}"></span>
                            <span class="font-semibold">${p.name} ${p.isLocal ? '(Du)' : ''}</span>
                            ${p.isHandRaised ? '<span class="text-amber-400 ml-1" title="Hand gehoben">✋</span>' : ''}
                        </div>

                        <!-- Muted Audio or Cam Off Indicators -->
                        <div class="absolute top-3 right-3 flex space-x-1.5 z-10">
                            ${!p.isMicOn ? '<div class="w-7 h-7 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-rose-400"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2 2m0-2l-2 2"></path></svg></div>' : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // Bind local video stream if active
            if (state.localStream) {
                const localVideoEl = document.getElementById('local-video-element');
                if (localVideoEl && localVideoEl.srcObject !== state.localStream) {
                    localVideoEl.srcObject = state.localStream;
                }
            }

            // Render Participants List in Sidebar
            const partList = document.getElementById('participants-list');
            partList.innerHTML = state.participants.map(p => `
                <div class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background-color: ${p.color};">
                            ${p.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <p class="text-xs font-semibold">${p.name} ${p.isLocal ? '(Du)' : ''}</p>
                            <p class="text-[10px] text-slate-400">${p.isMicOn ? 'Mikrofon aktiv' : 'Stumm'}</p>
                        </div>
                    </div>
                    ${p.isHandRaised ? '<span class="text-amber-400 text-sm">✋</span>' : ''}
                </div>
            `).join('');
        }

        // --- Run on Load ---
        window.onload = function() {
            router.init();
            startPreviewStream();
        };
    </script>
</body>
</html>
