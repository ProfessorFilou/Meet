<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FilouMeet - Sichere Videokonferenzen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        filou: {
                            50: '#f8fafc',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(2, 6, 23, 0.85);
        }
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.8); opacity: 1; }
            100% { transform: translateY(-160px) scale(1.4); opacity: 0; }
        }
        .floating-emoji {
            animation: floatUp 2.5s ease-out forwards;
            pointer-events: none;
        }
        .active-speaker-ring {
            box-shadow: 0 0 0 4px #000000, 0 0 20px rgba(0, 0, 0, 0.8);
            transition: box-shadow 0.2s ease-in-out;
        }
        .dark .active-speaker-ring {
            box-shadow: 0 0 0 4px #ffffff, 0 0 20px rgba(255, 255, 255, 0.6);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200 overflow-x-hidden">

    <div id="app" class="min-h-full flex flex-col">
        
        <!-- Navigation Header -->
        <header class="w-full border-b border-slate-200 dark:border-slate-800 glass-panel sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-2xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center shadow-lg font-bold text-lg">
                    F
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight">FilouMeet</span>
                    <span class="hidden sm:inline-block ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium">Pro</span>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-2xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-900 transition text-slate-700 dark:text-slate-200" title="Dark Mode umschalten">
                    <i id="darkModeIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
                <div id="headerUserInfo" class="hidden sm:flex items-center space-x-2 pl-2 border-l border-slate-200 dark:border-slate-800">
                    <div id="headerUserAvatar" class="w-8 h-8 rounded-full bg-black dark:bg-white text-white dark:text-black font-semibold flex items-center justify-center text-xs">?</div>
                    <span id="headerUserName" class="text-sm font-medium">Gast</span>
                </div>
            </div>
        </header>

        <!-- Main Viewport Router Container -->
        <main id="mainView" class="flex-1 flex flex-col relative">
            <!-- Dynamically injected views -->
        </main>
        
        <!-- Global Toast Notifications -->
        <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>
    </div>

    <script>
        // App State
        const state = {
            view: 'home', // 'home', 'lobby', 'meeting'
            userName: localStorage.getItem('filou_username') || '',
            roomCode: '',
            isHost: false,
            selectedColor: localStorage.getItem('filou_color') || 'black',
            micEnabled: true,
            camEnabled: true,
            screenSharing: false,
            handRaised: false,
            chatMessages: [
                { sender: 'System', text: 'Willkommen in der Konferenz! Sei respektvoll.', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }
            ],
            peers: new Map(), // peerId -> { name, color, stream }
            localStream: null,
            audioContext: null,
            analyser: null,
            speechInterval: null,
            roomLocked: false
        };

        const AVATAR_COLORS = [
            { name: 'black', class: 'bg-black dark:bg-white text-white dark:text-black' },
            { name: 'slate', class: 'bg-slate-700 text-white' },
            { name: 'blue', class: 'bg-blue-600 text-white' },
            { name: 'indigo', class: 'bg-indigo-600 text-white' },
            { name: 'purple', class: 'bg-purple-600 text-white' },
            { name: 'rose', class: 'bg-rose-600 text-white' },
            { name: 'emerald', class: 'bg-emerald-600 text-white' },
            { name: 'amber', class: 'bg-amber-600 text-white' }
        ];

        // Dark Mode Initialization
        function initDarkMode() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('darkModeIcon').className = 'fa-solid fa-sun text-sm';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('darkModeIcon').className = 'fa-solid fa-moon text-sm';
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('darkModeIcon').className = 'fa-solid fa-moon text-sm';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('darkModeIcon').className = 'fa-solid fa-sun text-sm';
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-600 text-white' : type === 'success' ? 'bg-emerald-600 text-white' : 'bg-black text-white dark:bg-white dark:text-black';
            toast.className = `px-4 py-3 rounded-2xl shadow-xl pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 flex items-center space-x-2 text-sm font-medium ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Router
        const router = {
            navigate(viewName, params = {}) {
                state.view = viewName;
                if (params.roomCode) state.roomCode = params.roomCode;
                
                if (viewName === 'home') {
                    window.location.hash = '#home';
                    stopLocalMedia();
                } else if (viewName === 'lobby') {
                    window.location.hash = `#lobby-${state.roomCode || generateRoomCode()}`;
                } else if (viewName === 'meeting') {
                    window.location.hash = `#room-${state.roomCode}`;
                }
                renderView();
            }
        };

        function generateRoomCode() {
            const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
            let code = '';
            for (let i = 0; i < 9; i++) {
                if (i > 0 && i % 3 === 0) code += '-';
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function updateHeaderUser() {
            const avatar = document.getElementById('headerUserAvatar');
            const nameEl = document.getElementById('headerUserName');
            if (state.userName) {
                nameEl.textContent = state.userName;
                avatar.textContent = state.userName.charAt(0).toUpperCase();
                const colorObj = AVATAR_COLORS.find(c => c.name === state.selectedColor) || AVATAR_COLORS[0];
                avatar.className = `w-8 h-8 rounded-full font-bold flex items-center justify-center text-xs ${colorObj.class}`;
            }
        }

        function renderView() {
            const main = document.getElementById('mainView');
            updateHeaderUser();
            
            if (state.view === 'home') {
                main.innerHTML = renderHomeView();
            } else if (state.view === 'lobby') {
                main.innerHTML = renderLobbyView();
                initLobbyPreview();
            } else if (state.view === 'meeting') {
                main.innerHTML = renderMeetingView();
                initMeetingSession();
            }
        }

        function renderHomeView() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center px-4 py-12 max-w-4xl mx-auto w-full text-center">
                    <div class="w-20 h-20 rounded-3xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center text-3xl font-extrabold shadow-2xl mb-6">
                        F
                    </div>
                    
                    <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
                        Sichere Videokonferenzen für <span class="underline decoration-black dark:decoration-white decoration-4 underline-offset-8">Professor Filou</span>
                    </h1>
                    
                    <p class="text-lg text-slate-600 dark:text-slate-400 max-w-xl mb-10">
                        Sofort einsatzbereit im Browser. Keine Downloads, keine Registrierung, absolut sicher.
                    </p>

                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-xl flex flex-col space-y-4">
                        <div class="flex flex-col sm:flex-row gap-3">
                            <input id="homeRoomInput" type="text" placeholder="Raumcode eingeben (z.B. abc-def-ghi)" class="flex-1 px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white font-medium text-center sm:text-left">
                            <button onclick="joinRoomFromHome()" class="px-6 py-3.5 bg-black hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-black font-semibold rounded-2xl shadow-xl transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                <span>Beitreten</span>
                            </button>
                        </div>
                        
                        <div class="relative flex py-2 items-center">
                            <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                            <span class="flex-shrink mx-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Oder</span>
                            <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                        </div>

                        <button onclick="createNewMeeting()" class="w-full py-4 bg-black hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-black font-bold rounded-2xl shadow-2xl transition flex items-center justify-center space-x-3 text-lg">
                            <i class="fa-solid fa-video"></i>
                            <span>Neuen Raum erstellen</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function createNewMeeting() {
            const code = generateRoomCode();
            state.isHost = true;
            router.navigate('lobby', { roomCode: code });
        }

        function joinRoomFromHome() {
            const input = document.getElementById('homeRoomInput');
            let val = input.value.trim().toLowerCase();
            if (!val) {
                showToast('Bitte gib einen gültigen Raumcode ein.', 'error');
                return;
            }
            if (val.includes('#room-')) val = val.split('#room-')[1];
            if (val.includes('#lobby-')) val = val.split('#lobby-')[1];
            state.isHost = false;
            router.navigate('lobby', { roomCode: val });
        }

        function renderLobbyView() {
            if (!state.userName) {
                state.userName = 'FilouGast_' + Math.floor(Math.random() * 900 + 100);
            }
            return `
                <div class="flex-1 flex items-center justify-center px-4 py-8 max-w-4xl mx-auto w-full">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 sm:p-10 rounded-3xl shadow-2xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                        
                        <!-- Video Preview -->
                        <div class="flex flex-col items-center">
                            <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-inner flex items-center justify-center border border-slate-800">
                                <video id="previewVideo" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
                                <div id="previewAvatarFallback" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950">
                                    <div id="lobbyBigAvatar" class="w-20 h-20 rounded-full font-bold text-3xl flex items-center justify-center shadow-lg">?</div>
                                    <span class="text-slate-400 text-xs mt-2">Kamera aus</span>
                                </div>
                                <div class="absolute bottom-3 left-3 flex space-x-2">
                                    <button onclick="togglePreviewMic()" id="lobbyMicBtn" class="p-2.5 rounded-2xl bg-black/80 hover:bg-black text-white backdrop-blur transition">
                                        <i id="lobbyMicIcon" class="fa-solid fa-microphone text-sm"></i>
                                    </button>
                                    <button onclick="togglePreviewCam()" id="lobbyCamBtn" class="p-2.5 rounded-2xl bg-black/80 hover:bg-black text-white backdrop-blur transition">
                                        <i id="lobbyCamIcon" class="fa-solid fa-video text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Configuration -->
                        <div class="flex flex-col space-y-6">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Lobby</span>
                                <h2 class="text-2xl font-bold mt-1">Bereit fürs Meeting?</h2>
                                <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Raum: <span class="font-mono font-semibold">${state.roomCode}</span></p>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Dein Name</label>
                                    <input id="lobbyNameInput" type="text" value="${state.userName}" oninput="onNameInput(this.value)" placeholder="Name eingeben" class="w-full px-4 py-3 rounded-2xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white font-medium">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-2">Avatar Stil</label>
                                    <div class="flex space-x-2">
                                        ${AVATAR_COLORS.map(c => `
                                            <button onclick="selectColor('${c.name}')" class="w-8 h-8 rounded-full ${c.class} transition transform hover:scale-110 ${state.selectedColor === c.name ? 'ring-4 ring-black dark:ring-white' : ''}"></button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>

                            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                                <button onclick="router.navigate('home')" class="px-5 py-3 rounded-2xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-sm transition text-center">
                                    Abbrechen
                                </button>
                                <button onclick="enterMeeting()" class="flex-1 py-3.5 bg-black hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-black font-bold rounded-2xl shadow-2xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-right-to-bracket"></i>
                                    <span>Beitreten</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        async function initLobbyPreview() {
            updateLobbyAvatarDisplay();
            try {
                state.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const videoEl = document.getElementById('previewVideo');
                if (videoEl) {
                    videoEl.srcObject = state.localStream;
                    document.getElementById('previewAvatarFallback').style.display = 'none';
                }
            } catch (err) {
                console.warn('Media warning:', err);
                document.getElementById('previewAvatarFallback').style.display = 'flex';
                const videoEl = document.getElementById('previewVideo');
                if (videoEl) videoEl.style.display = 'none';
                state.camEnabled = false;
                state.micEnabled = false;
                updateLobbyMediaButtons();
            }
        }

        function onNameInput(val) {
            state.userName = val.trim();
            localStorage.setItem('filou_username', state.userName);
            updateLobbyAvatarDisplay();
        }

        function selectColor(colorName) {
            state.selectedColor = colorName;
            localStorage.setItem('filou_color', colorName);
            renderView();
        }

        function updateLobbyAvatarDisplay() {
            const bigAv = document.getElementById('lobbyBigAvatar');
            if (bigAv) {
                const initial = state.userName ? state.userName.charAt(0).toUpperCase() : '?';
                bigAv.textContent = initial;
                const colorObj = AVATAR_COLORS.find(c => c.name === state.selectedColor) || AVATAR_COLORS[0];
                bigAv.className = `w-20 h-20 rounded-full font-bold text-3xl flex items-center justify-center shadow-lg ${colorObj.class}`;
            }
        }

        function togglePreviewMic() {
            state.micEnabled = !state.micEnabled;
            if (state.localStream) state.localStream.getAudioTracks().forEach(t => t.enabled = state.micEnabled);
            updateLobbyMediaButtons();
        }

        function togglePreviewCam() {
            state.camEnabled = !state.camEnabled;
            if (state.localStream) state.localStream.getVideoTracks().forEach(t => t.enabled = state.camEnabled);
            updateLobbyMediaButtons();
            const videoEl = document.getElementById('previewVideo');
            const fallback = document.getElementById('previewAvatarFallback');
            if (videoEl && fallback) {
                if (state.camEnabled) {
                    videoEl.style.display = 'block';
                    fallback.style.display = 'none';
                } else {
                    videoEl.style.display = 'none';
                    fallback.style.display = 'flex';
                }
            }
        }

        function updateLobbyMediaButtons() {
            const micBtn = document.getElementById('lobbyMicBtn');
            const micIcon = document.getElementById('lobbyMicIcon');
            const camBtn = document.getElementById('lobbyCamBtn');
            const camIcon = document.getElementById('lobbyCamIcon');
            if (micBtn && micIcon) {
                micBtn.className = `p-2.5 rounded-2xl transition ${state.micEnabled ? 'bg-black/80 text-white' : 'bg-rose-600 text-white'}`;
                micIcon.className = `fa-solid ${state.micEnabled ? 'fa-microphone' : 'fa-microphone-slash'} text-sm`;
            }
            if (camBtn && camIcon) {
                camBtn.className = `p-2.5 rounded-2xl transition ${state.camEnabled ? 'bg-black/80 text-white' : 'bg-rose-600 text-white'}`;
                camIcon.className = `fa-solid ${state.camEnabled ? 'fa-video' : 'fa-video-slash'} text-sm`;
            }
        }

        function stopLocalMedia() {
            if (state.localStream) {
                state.localStream.getTracks().forEach(t => t.stop());
                state.localStream = null;
            }
            if (state.speechInterval) {
                clearInterval(state.speechInterval);
                state.speechInterval = null;
            }
        }

        function enterMeeting() {
            if (!state.userName) state.userName = 'Gast';
            router.navigate('meeting');
        }

        function renderMeetingView() {
            return `
                <div class="flex-1 flex flex-col h-[calc(100vh-65px)] relative overflow-hidden bg-slate-950">
                    
                    <!-- Top Bar Info -->
                    <div class="absolute top-4 left-4 z-20 flex items-center space-x-2 bg-black/80 dark:bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-slate-800 text-xs font-medium text-slate-300 shadow-2xl">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="font-mono font-bold text-white">${state.roomCode}</span>
                        <button onclick="copyRoomLink()" class="ml-2 px-2 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-white transition" title="Link kopieren">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>

                    <!-- Video Grid Container (Mobile optimized: vertical stack on mobile, grid on desktop) -->
                    <div id="videoGridContainer" class="flex-1 p-3 sm:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 items-center justify-center overflow-y-auto">
                        <!-- Zero fake participants enforced: Only local user initially -->
                        <div id="tile-local" class="relative bg-black rounded-3xl overflow-hidden aspect-video shadow-2xl border border-slate-800 flex items-center justify-center group transition-all duration-300">
                            <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100 ${state.camEnabled ? '' : 'hidden'}"></video>
                            
                            <div id="localAvatarFallback" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 ${state.camEnabled ? 'hidden' : ''}">
                                <div id="localBigAvatar" class="w-24 h-24 rounded-full font-bold text-4xl flex items-center justify-center shadow-2xl ${AVATAR_COLORS.find(c => c.name === state.selectedColor)?.class || 'bg-black text-white'}">
                                    ${state.userName.charAt(0).toUpperCase()}
                                </div>
                            </div>

                            <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-2xl flex items-center space-x-2 border border-slate-800/50">
                                <span id="localHandBadge" class="hidden text-amber-400 text-sm"><i class="fa-solid fa-hand"></i></span>
                                <span class="text-xs font-semibold text-white">${state.userName} (Du)</span>
                                <span id="localMicIndicator" class="${state.micEnabled ? 'text-emerald-400' : 'text-rose-500'} text-xs">
                                    <i class="fa-solid ${state.micEnabled ? 'fa-microphone' : 'fa-microphone-slash'}"></i>
                                </span>
                            </div>

                            <div id="localAudioWave" class="absolute top-3 right-3 hidden">
                                <span class="flex h-3 w-3 relative">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Floating Reactions Layer -->
                    <div id="floatingReactionsLayer" class="absolute inset-0 pointer-events-none overflow-hidden z-30"></div>

                    <!-- Collapsible Side Drawer (Chat / Participants) -->
                    <div id="sideDrawer" class="absolute top-0 right-0 h-full w-full sm:w-96 bg-black/95 dark:bg-slate-950/95 backdrop-blur-2xl border-l border-slate-800 shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col">
                        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                            <h3 id="drawerTitle" class="font-bold text-base text-white">Chat</h3>
                            <button onclick="closeSideDrawer()" class="p-2 rounded-2xl hover:bg-slate-800 text-slate-400 hover:text-white transition">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>
                        <div id="drawerBody" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4"></div>
                    </div>

                    <!-- Bottom Control Toolbar (Sleek Deep Black Buttons) -->
                    <div class="bg-black/90 dark:bg-slate-950/90 backdrop-blur-md border-t border-slate-800 py-3 px-4 flex items-center justify-between z-20">
                        <div class="hidden md:flex items-center space-x-2 text-xs text-slate-400">
                            <i class="fa-solid fa-shield-halved text-white"></i>
                            <span>Verschlüsselt</span>
                        </div>

                        <!-- Center Action Buttons -->
                        <div class="flex items-center space-x-2 sm:space-x-3 mx-auto">
                            <button onclick="toggleMeetingMic()" id="meetingMicBtn" class="p-3 sm:p-3.5 rounded-2xl ${state.micEnabled ? 'bg-slate-800 hover:bg-slate-700 text-white' : 'bg-rose-600 text-white'} shadow-xl transition" title="Mikrofon">
                                <i id="meetingMicIcon" class="fa-solid ${state.micEnabled ? 'fa-microphone' : 'fa-microphone-slash'} text-base"></i>
                            </button>

                            <button onclick="toggleMeetingCam()" id="meetingCamBtn" class="p-3 sm:p-3.5 rounded-2xl ${state.camEnabled ? 'bg-slate-800 hover:bg-slate-700 text-white' : 'bg-rose-600 text-white'} shadow-xl transition" title="Kamera">
                                <i id="meetingCamIcon" class="fa-solid ${state.camEnabled ? 'fa-video' : 'fa-video-slash'} text-base"></i>
                            </button>

                            <button onclick="toggleScreenShare()" id="meetingScreenBtn" class="p-3 sm:p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white shadow-xl transition hidden sm:flex" title="Bildschirm teilen">
                                <i class="fa-solid fa-desktop text-base"></i>
                            </button>

                            <button onclick="toggleHandRaise()" id="meetingHandBtn" class="p-3 sm:p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white shadow-xl transition" title="Hand heben">
                                <i class="fa-solid fa-hand text-base"></i>
                            </button>

                            <button onclick="openReactionMenu()" class="p-3 sm:p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white shadow-xl transition" title="Reaktionen">
                                <i class="fa-solid fa-face-smile text-base"></i>
                            </button>

                            <button onclick="leaveMeeting()" class="px-5 py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl shadow-xl transition flex items-center space-x-2">
                                <i class="fa-solid fa-phone-slash"></i>
                                <span class="hidden sm:inline">Verlassen</span>
                            </button>
                        </div>

                        <!-- Right Drawer toggles -->
                        <div class="flex items-center space-x-2">
                            <button onclick="openParticipantsDrawer()" class="p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white transition relative" title="Teilnehmer">
                                <i class="fa-solid fa-users"></i>
                                <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-white text-black text-xs font-bold flex items-center justify-center">1</span>
                            </button>
                            <button onclick="openChatDrawer()" class="p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white transition relative" title="Chat">
                                <i class="fa-solid fa-comment-dots"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function initMeetingSession() {
            if (!state.localStream) {
                try {
                    state.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                } catch (e) {
                    console.warn('Media fallback active:', e);
                    state.camEnabled = false;
                    state.micEnabled = false;
                }
            }
            const videoEl = document.getElementById('localVideo');
            if (videoEl && state.localStream) videoEl.srcObject = state.localStream;
            updateMeetingMediaButtons();
            initWebAudioAnalyzer();
        }

        function initWebAudioAnalyzer() {
            if (!state.localStream) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                state.audioContext = new AudioContext();
                state.analyser = state.audioContext.createAnalyser();
                const source = state.audioContext.createMediaStreamSource(state.localStream);
                source.connect(state.analyser);
                state.analyser.fftSize = 512;
                const bufferLength = state.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                state.speechInterval = setInterval(() => {
                    if (!state.micEnabled) return;
                    state.analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                    let average = sum / bufferLength;
                    const tile = document.getElementById('tile-local');
                    const wave = document.getElementById('localAudioWave');
                    if (average > 18) {
                        if (tile) tile.classList.add('active-speaker-ring');
                        if (wave) wave.style.display = 'block';
                    } else {
                        if (tile) tile.classList.remove('active-speaker-ring');
                        if (wave) wave.style.display = 'none';
                    }
                }, 200);
            } catch (e) {
                console.warn('Web Audio error:', e);
            }
        }

        function toggleMeetingMic() {
            state.micEnabled = !state.micEnabled;
            if (state.localStream) state.localStream.getAudioTracks().forEach(t => t.enabled = state.micEnabled);
            updateMeetingMediaButtons();
            showToast(state.micEnabled ? 'Mikrofon an' : 'Mikrofon stumm');
        }

        function toggleMeetingCam() {
            state.camEnabled = !state.camEnabled;
            if (state.localStream) state.localStream.getVideoTracks().forEach(t => t.enabled = state.camEnabled);
            updateMeetingMediaButtons();
            const videoEl = document.getElementById('localVideo');
            const fallback = document.getElementById('localAvatarFallback');
            if (videoEl && fallback) {
                if (state.camEnabled) {
                    videoEl.classList.remove('hidden');
                    fallback.classList.add('hidden');
                } else {
                    videoEl.classList.add('hidden');
                    fallback.classList.remove('hidden');
                }
            }
            showToast(state.camEnabled ? 'Kamera an' : 'Kamera aus');
        }

        function updateMeetingMediaButtons() {
            const micBtn = document.getElementById('meetingMicBtn');
            const micIcon = document.getElementById('meetingMicIcon');
            const camBtn = document.getElementById('meetingCamBtn');
            const camIcon = document.getElementById('meetingCamIcon');
            const indicator = document.getElementById('localMicIndicator');

            if (micBtn && micIcon) {
                micBtn.className = `p-3 sm:p-3.5 rounded-2xl shadow-xl transition ${state.micEnabled ? 'bg-slate-800 hover:bg-slate-700 text-white' : 'bg-rose-600 text-white'}`;
                micIcon.className = `fa-solid ${state.micEnabled ? 'fa-microphone' : 'fa-microphone-slash'} text-base`;
            }
            if (camBtn && camIcon) {
                camBtn.className = `p-3 sm:p-3.5 rounded-2xl shadow-xl transition ${state.camEnabled ? 'bg-slate-800 hover:bg-slate-700 text-white' : 'bg-rose-600 text-white'}`;
                camIcon.className = `fa-solid ${state.camEnabled ? 'fa-video' : 'fa-video-slash'} text-base`;
            }
            if (indicator) {
                indicator.className = `${state.micEnabled ? 'text-emerald-400' : 'text-rose-500'} text-xs`;
                indicator.innerHTML = `<i class="fa-solid ${state.micEnabled ? 'fa-microphone' : 'fa-microphone-slash'}"></i>`;
            }
        }

        function toggleHandRaise() {
            state.handRaised = !state.handRaised;
            const badge = document.getElementById('localHandBadge');
            const btn = document.getElementById('meetingHandBtn');
            if (badge) badge.classList.toggle('hidden', !state.handRaised);
            if (btn) btn.className = `p-3 sm:p-3.5 rounded-2xl shadow-xl transition ${state.handRaised ? 'bg-amber-500 text-black font-bold' : 'bg-slate-800 hover:bg-slate-700 text-white'}`;
            showToast(state.handRaised ? 'Hand gehoben' : 'Hand gesenkt');
        }

        async function toggleScreenShare() {
            try {
                if (!state.screenSharing) {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const videoEl = document.getElementById('localVideo');
                    if (videoEl) videoEl.srcObject = screenStream;
                    screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
                    state.screenSharing = true;
                    showToast('Bildschirmfreigabe aktiv', 'success');
                } else {
                    stopScreenShare();
                }
            } catch (err) {
                console.warn('Screen share cancelled:', err);
            }
        }

        function stopScreenShare() {
            state.screenSharing = false;
            if (state.localStream) {
                const videoEl = document.getElementById('localVideo');
                if (videoEl) videoEl.srcObject = state.localStream;
            }
            showToast('Bildschirmfreigabe beendet');
        }

        function openReactionMenu() {
            const emojis = ['👍', '❤️', '👏', '🔥', '🎉', '💡'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            const layer = document.getElementById('floatingReactionsLayer');
            if (!layer) return;
            const el = document.createElement('div');
            el.className = 'absolute bottom-20 left-1/2 transform -translate-x-1/2 text-4xl floating-emoji';
            el.textContent = randomEmoji;
            layer.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function copyRoomLink() {
            const url = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => showToast('Link kopiert!', 'success'));
            } else {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = url;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast('Link kopiert!', 'success');
            }
        }

        function openChatDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const title = document.getElementById('drawerTitle');
            const body = document.getElementById('drawerBody');
            title.textContent = 'Konferenz-Chat';
            body.innerHTML = `
                <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="chatMessagesList">
                    ${state.chatMessages.map(m => `
                        <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800">
                            <div class="flex items-center justify-between mb-1">
                                <span class="font-bold text-xs text-slate-300">${m.sender}</span>
                                <span class="text-[10px] text-slate-500">${m.time}</span>
                            </div>
                            <p class="text-sm text-slate-100">${m.text}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="pt-3 border-t border-slate-800 flex space-x-2">
                    <input id="chatInputText" type="text" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') sendChatMessage()" class="flex-1 px-3.5 py-2.5 rounded-2xl bg-slate-900 border border-slate-800 text-sm text-white focus:outline-none focus:ring-2 focus:ring-white">
                    <button onclick="sendChatMessage()" class="px-4 py-2.5 bg-white text-black font-semibold rounded-2xl text-sm transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            `;
            drawer.classList.remove('translate-x-full');
            const list = document.getElementById('chatMessagesList');
            if (list) list.scrollTop = list.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInputText');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            state.chatMessages.push({ sender: state.userName + ' (Du)', text, time });
            input.value = '';
            openChatDrawer();
        }

        function openParticipantsDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const title = document.getElementById('drawerTitle');
            const body = document.getElementById('drawerBody');
            title.textContent = 'Teilnehmer (1)';
            body.innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-900 border border-slate-800">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-full bg-white text-black font-bold text-xs flex items-center justify-center">${state.userName.charAt(0).toUpperCase()}</div>
                            <span class="text-sm font-medium text-white">${state.userName} (Du)</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-medium">Host</span>
                    </div>
                </div>
            `;
            drawer.classList.remove('translate-x-full');
        }

        function closeSideDrawer() {
            const drawer = document.getElementById('sideDrawer');
            if (drawer) drawer.classList.add('translate-x-full');
        }

        function leaveMeeting() {
            stopLocalMedia();
            router.navigate('home');
            showToast('Konferenz verlassen.');
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDarkMode();
            const hash = window.location.hash;
            if (hash.startsWith('#lobby-')) {
                router.navigate('lobby', { roomCode: hash.replace('#lobby-', '') });
            } else if (hash.startsWith('#room-')) {
                router.navigate('lobby', { roomCode: hash.replace('#room-', '') });
            } else {
                router.navigate('home');
            }
        });
    </script>
</body>
</html>
